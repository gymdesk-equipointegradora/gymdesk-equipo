name: Reporte de error
description: Algo de GymDesk no funciona como debería (QA)
title: "[Error] "
labels: ["error"]
body:
  - type: input
    id: version
    attributes:
      label: Versión de GymDesk
      placeholder: "1.14.0"
    validations:
      required: true
  - type: input
    id: caso
    attributes:
      label: Caso de prueba
      description: ID del caso en la carpeta pruebas/, si existe
      placeholder: "ACC-02"
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Caja
        2. Agregar un producto
        3. Cobrar con tarjeta
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Qué pasó en realidad
      description: Agrega capturas de pantalla si puedes
    validations:
      required: true
  - type: dropdown
    id: gravedad
    attributes:
      label: Gravedad
      options:
        - Bloquea la operación del gimnasio
        - Molesta pero hay forma de seguir
        - Detalle visual o de texto
    validations:
      required: true
